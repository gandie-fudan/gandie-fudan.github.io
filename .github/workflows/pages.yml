name: Build and deploy academic website
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academic-site-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build bilingual website
        run: python3 build.py
      - name: Validate website
        run: python3 validate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Wait for any legacy Pages publish to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 wait_legacy.py
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

